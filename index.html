<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>학습노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f2ec; --paper-line:#d7d2c4; --ink:#2b2a26; --ink-soft:#6b6a62;
    --accent:#4b5d52; --accent-soft:#9fae9f; --card:#fbfaf6; --shadow: 0 1px 2px rgba(43,42,38,0.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background: var(--paper);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px; background-position: 0 96px;
    color:var(--ink); font-family:'Noto Sans KR', sans-serif; -webkit-font-smoothing:antialiased;
  }
  .layout{ max-width: 1080px; margin:0 auto; display:flex; gap: 0; align-items:flex-start; }
  .app{ flex:1; max-width: 880px; min-height:100vh; display:flex; flex-direction:column; padding: 0 28px 40px; }

  header.page-head{
    padding-top: 30px; padding-bottom: 14px; display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid var(--paper-line); margin-bottom: 6px;
  }
  header.page-head h1{ font-family:'Nanum Myeongjo', serif; font-weight:800; font-size: 26px; letter-spacing:-0.01em; margin:0; }
  .head-right{ display:flex; align-items:center; gap:14px; }
  .meta{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .collections-toggle{ font-size:12px; color:var(--ink-soft); cursor:pointer; border-bottom:1px dashed var(--ink-soft); }
  .collections-toggle:hover{ color:var(--ink); }

  .entry-form{ margin-top: 28px; display:flex; gap:10px; }
  .entry-form input{
    flex:1; border:none; border-bottom: 1.5px solid var(--ink); background:transparent;
    font-family:'Noto Sans KR', sans-serif; font-size:16px; padding: 6px 2px; color: var(--ink); outline:none;
  }
  .entry-form input::placeholder{ color: var(--ink-soft); }
  .entry-form button{
    border:1px solid var(--ink); background:var(--ink); color:var(--paper);
    font-family:'Noto Sans KR', sans-serif; font-size:13px; padding: 0 18px; cursor:pointer; letter-spacing:0.02em;
  }
  .entry-form button:hover{ opacity:0.85; }
  .search-hint{ font-size:11px; color:var(--ink-soft); margin-top:6px; font-family:'JetBrains Mono', monospace; min-height: 14px; }

  .results{ margin-top: 10px; }
  .results .result-row{ display:flex; align-items:baseline; gap:14px; padding: 9px 4px; cursor:pointer; border-bottom: 1px dashed var(--paper-line); }
  .results .result-row:hover{ background: rgba(75,93,82,0.06); }
  .result-row .idx{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--accent-soft); width: 20px; flex-shrink:0; }
  .result-row .word{ font-weight:500; font-size:15px; flex:1; }
  .result-row .meaning{ font-size:12.5px; color: var(--ink-soft); font-style:italic; }

  .list-head-row{ display:flex; align-items:center; justify-content:space-between; margin-top:18px; }
  .list-head-row .save-link{ font-size:12px; color:var(--ink-soft); cursor:pointer; border-bottom:1px dashed var(--ink-soft); }
  .list-head-row .save-link:hover{ color:var(--ink); }

  .notes-list{ list-style:none; padding:0; margin: 8px 0 0; flex:1; }
  .notes-list li{ display:flex; align-items:center; gap:12px; padding: 8px 4px; border-bottom: 1px solid var(--paper-line); font-size:14.5px; }
  .notes-list li .bullet{ width:16px; height:16px; flex-shrink:0; border-radius:50%; border:1.5px solid var(--ink-soft); cursor:pointer; }
  .notes-list li.active .bullet{ border-color:var(--accent); background:var(--accent); }
  .notes-list li .word-col{ flex:1; cursor:pointer; }
  .notes-list li .word-col .w{ font-weight:500; }
  .notes-list li .word-col .m{ font-size:12px; color:var(--ink-soft); margin-left:8px;}
  .notes-list li .remove{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--ink-soft); cursor:pointer; opacity:0; }
  .notes-list li:hover .remove{ opacity:1; }
  .notes-list li.active{ color:var(--accent); }
  .notes-list .empty{ color:var(--ink-soft); font-size:13px; padding: 20px 4px; text-align:center; border-bottom:none; }

  .write-line-block{ margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--paper-line); }
  .write-line{
    font-family:'Nanum Myeongjo', serif; font-size:14.5px; line-height:1.7; letter-spacing:0.01em;
    cursor:text; user-select:none; min-height: 26px; color: var(--ink);
  }
  .write-line .blank{ color: var(--paper-line); }
  .write-line .caret{ display:inline-block; width:1px; background:var(--accent); animation: blink 1s step-start infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .nav-row{ margin-top: 14px; display:flex; align-items:center; justify-content:center; gap: 22px; }
  .nav-row button{ background:none; border:none; font-family:'Noto Sans KR', sans-serif; color: var(--ink-soft); font-size:13px; cursor:pointer; letter-spacing:0.02em; }
  .nav-row button:hover{ color:var(--ink); }
  .nav-row #playPauseBtn{ padding: 0 4px; min-width: 56px; }

  .footer-note{ margin-top:26px; font-size:11px; color:var(--paper-line); text-align:center; user-select:none; }

  .sync-dot{ position:fixed; right:16px; bottom:14px; width:7px; height:7px; border-radius:50%; background: var(--paper-line); cursor:pointer; }
  .sync-dot.linked{ background: var(--accent-soft); }
  .sync-dot:hover{ background:var(--accent-soft); }

  .modal-overlay{ position:fixed; inset:0; background: rgba(43,42,38,0.35); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal-overlay.hidden{ display:none; }
  .modal-box{ background:var(--card); border:1px solid var(--paper-line); padding: 22px 24px; width: 300px; box-shadow: var(--shadow); }
  .modal-box p{ margin:0 0 12px; font-size:13px; color:var(--ink-soft); }
  .modal-box .row{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .modal-box button{ border:1px solid var(--ink); background:transparent; padding: 6px 14px; font-size:12px; cursor:pointer; color:var(--ink); }
  .modal-box button.primary{ background:var(--ink); color:var(--paper); }
  .modal-box .status{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--accent); min-height:14px; }
  .modal-box input[type=text]{ width:100%; border:none; border-bottom:1.5px solid var(--ink); background:transparent; padding:6px 2px; font-size:14px; outline:none; margin-top:4px; }

  .side-panel{ width: 0; overflow:hidden; transition: width 0.15s ease; border-left: 1px solid var(--paper-line); min-height:100vh; }
  .side-panel.open{ width: 260px; }
  .side-panel-inner{ width:260px; padding: 30px 20px; }
  .side-panel h2{ font-family:'Nanum Myeongjo', serif; font-size:16px; margin:0 0 14px; }
  .collection-item{ padding: 9px 4px; border-bottom: 1px dashed var(--paper-line); cursor:pointer; }
  .collection-item:hover{ background: rgba(75,93,82,0.06); }
  .collection-item .name{ font-size:13.5px; font-weight:500; }
  .collection-item .count{ font-size:11px; color:var(--ink-soft); margin-left:6px; }
  .collection-item .del{ float:right; font-size:11px; color:var(--ink-soft); opacity:0; }
  .collection-item:hover .del{ opacity:1; }
  .side-panel .empty-note{ font-size:12.5px; color:var(--ink-soft); }
</style>
</head>
<body>

<div class="layout">
  <div class="app">
    <header class="page-head">
      <h1>학습노트</h1>
      <div class="head-right">
        <span class="collections-toggle" id="collectionsToggle">모음집</span>
        <div class="meta" id="dateLabel"></div>
      </div>
    </header>

    <div class="entry-form">
      <input id="wordInput" type="text" placeholder="오늘의 단어를 입력하세요" autocomplete="off" />
      <button id="addBtn">추가</button>
    </div>
    <div class="search-hint" id="searchHint"></div>

    <div class="results" id="results"></div>

    <div class="list-head-row">
      <span></span>
      <span class="save-link" id="saveCollectionLink">현재 목록 저장</span>
    </div>
    <ul class="notes-list" id="notesList">
      <li class="empty">아직 추가한 단어가 없습니다.</li>
    </ul>

    <div class="write-line-block">
      <div class="write-line" id="writeLine">&nbsp;</div>
    </div>

    <div class="nav-row">
      <button id="prevBtn">이전 문제</button>
      <button id="playPauseBtn">이어보기</button>
      <button id="nextBtn">다음 문제</button>
    </div>

    <div class="footer-note">학습노트 v1.0</div>
  </div>

  <div class="side-panel" id="sidePanel">
    <div class="side-panel-inner">
      <h2>노트 모음집</h2>
      <div id="collectionsList"><div class="empty-note">저장된 모음집이 없습니다.</div></div>

      <h2 style="margin-top:26px;">계정 재생목록</h2>
      <div id="accountPlaylistsList"><div class="empty-note">불러오는 중...</div></div>
    </div>
  </div>
</div>

<div class="sync-dot" id="syncDot" title=""></div>
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <p id="modalText">동기화되지 않았습니다.</p>
    <div class="status" id="modalStatus"></div>
    <div class="row">
      <button id="closeModalBtn">닫기</button>
      <button id="syncBtn" class="primary">동기화 시작</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="saveModalOverlay">
  <div class="modal-box">
    <p>모음집 이름을 입력하세요.</p>
    <input type="text" id="saveNameInput" placeholder="예: 국어 단원1" />
    <div class="row">
      <button id="cancelSaveBtn">취소</button>
      <button id="confirmSaveBtn" class="primary">저장</button>
    </div>
  </div>
</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
(function(){
  let accessToken = null;
  let tokenExpiresAt = 0;
  let deviceId = null;
  let player = null;
  let sdkReady = false;

  let queue = [];
  let currentIndex = -1;
  let progressTimer = null;
  let localPaused = true;
  let localPosition = 0;
  let localDuration = 0;

  const WRITE_TEXT = "오늘 배운 내용을 정리하면 다음과 같다 우선 핵심 개념을 이해하고 예제를 통해 확인한 뒤 요약 노트를 다시 한번 작성해 본다";

  const $ = (id) => document.getElementById(id);

  (function setDate(){
    const d = new Date();
    const w = ['일','월','화','수','목','금','토'][d.getDay()];
    $('dateLabel').textContent = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${w})`;
  })();

  function consumeHash(){
    if(location.hash && location.hash.length > 1){
      const params = new URLSearchParams(location.hash.slice(1));
      if(params.get('at')){
        accessToken = params.get('at');
        const expIn = parseInt(params.get('exp') || '3600', 10);
        tokenExpiresAt = Date.now() + expIn * 1000;
        history.replaceState(null, '', location.pathname);
        updateSyncDot(); initSpotifySdk(); scheduleRefresh();
        return true;
      }
    }
    if(new URLSearchParams(location.search).get('sync_error')){
      history.replaceState(null, '', location.pathname);
    }
    return false;
  }

  async function restoreSession(){
    try{
      const res = await fetch('/api/session', { credentials: 'same-origin' });
      const data = await res.json();
      if(data && data.authenticated){
        accessToken = data.access_token;
        tokenExpiresAt = Date.now() + (data.expires_in || 3600) * 1000;
        updateSyncDot(); initSpotifySdk(); scheduleRefresh();
      }
    }catch(e){}
  }

  function updateSyncDot(){
    $('syncDot').classList.toggle('linked', !!accessToken);
    $('modalText').textContent = accessToken ? '동기화되었습니다.' : '동기화되지 않았습니다.';
  }

  function scheduleRefresh(){
    setTimeout(doRefresh, Math.max(10000, tokenExpiresAt - Date.now() - 60000));
  }
  async function doRefresh(){
    try{
      const res = await fetch('/api/session', { credentials: 'same-origin' });
      const data = await res.json();
      if(data && data.authenticated){
        accessToken = data.access_token;
        tokenExpiresAt = Date.now() + (data.expires_in || 3600) * 1000;
        scheduleRefresh();
      } else { accessToken = null; updateSyncDot(); }
    }catch(e){}
  }

  if(!consumeHash()){ restoreSession(); }

  window.onSpotifyWebPlaybackSDKReady = () => { sdkReady = true; if(accessToken) initSpotifySdk(); };

  function initSpotifySdk(){
    if(!sdkReady || player) return;
    player = new Spotify.Player({ name: '학습노트', getOAuthToken: cb => cb(accessToken), volume: 0.8 });
    player.addListener('ready', ({ device_id }) => { deviceId = device_id; });
    player.addListener('not_ready', () => { deviceId = null; });
    player.addListener('player_state_changed', (state) => {
      if(!state) return;
      localPaused = state.paused; localPosition = state.position; localDuration = state.duration;
      $('playPauseBtn').textContent = localPaused ? '이어보기' : '잠시멈춤';
      if(!state.paused) startProgressTimer(); else stopProgressTimer();
      renderWriteLine(localPosition, localDuration);
    });
    player.addListener('authentication_error', () => { accessToken=null; updateSyncDot(); });
    player.addListener('account_error', () => { $('searchHint').textContent = 'Premium 계정이 필요합니다.'; });
    player.connect();
  }

  function startProgressTimer(){
    stopProgressTimer();
    const startedAt = Date.now(); const basePos = localPosition;
    progressTimer = setInterval(() => {
      const cur = basePos + (Date.now() - startedAt);
      renderWriteLine(cur, localDuration);
      if(localDuration > 0 && cur >= localDuration - 300) goNext();
    }, 400);
  }
  function stopProgressTimer(){ if(progressTimer) clearInterval(progressTimer); }

  function renderWriteLine(posMs, durMs){
    const line = $('writeLine');
    if(!durMs || durMs <= 0){ line.innerHTML = '&nbsp;'; return; }
    const ratio = Math.min(1, Math.max(0, posMs / durMs));
    const revealCount = Math.floor(WRITE_TEXT.length * ratio);
    const shown = WRITE_TEXT.slice(0, revealCount);
    const rest = WRITE_TEXT.slice(revealCount).replace(/[^\s]/g, '_');
    line.innerHTML = `${escapeHtml(shown)}<span class="caret">|</span>${escapeHtml(rest)}`;
  }

  $('writeLine').addEventListener('click', (e) => {
    if(!player || localDuration <= 0) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    player.seek(ratio * localDuration);
  });

  async function search(query){
    const hint = $('searchHint'); $('results').innerHTML = '';
    if(!accessToken){ hint.textContent = '검색을 사용하려면 동기화가 필요합니다 (우측 하단 점).'; return; }
    hint.textContent = '찾는 중...';
    try{
      const res = await fetch(`https://api.spotify.com/v1/search?type=track&limit=6&q=${encodeURIComponent(query)}`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      if(res.status === 401){ hint.textContent = '다시 동기화해주세요.'; accessToken = null; updateSyncDot(); return; }
      const data = await res.json();
      const items = ((data.tracks && data.tracks.items) || []).map(t => ({
        uri: t.uri, title: t.name, artist: t.artists.map(a => a.name).join(', ')
      }));
      hint.textContent = items.length ? '' : '결과가 없습니다.';
      renderResults(items);
    }catch(e){ hint.textContent = '네트워크 오류가 발생했습니다.'; }
  }

  function renderResults(items){
    const box = $('results'); box.innerHTML = '';
    items.forEach((item, i) => {
      const row = document.createElement('div'); row.className = 'result-row';
      row.innerHTML = `<span class="idx">${String(i+1).padStart(2,'0')}</span>
        <span class="word">${escapeHtml(item.title)}</span>
        <span class="meaning">${escapeHtml(item.artist)}</span>`;
      row.addEventListener('click', () => {
        addToQueue(item); $('results').innerHTML = ''; $('wordInput').value = ''; $('searchHint').textContent = '';
      });
      box.appendChild(row);
    });
  }

  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function addToQueue(item){ queue.push(item); renderQueue(); if(currentIndex === -1) playIndex(queue.length - 1); }
  function removeFromQueue(i){
    queue.splice(i,1);
    if(currentIndex === i){ currentIndex = -1; if(player) player.pause(); $('playPauseBtn').textContent = '이어보기'; renderWriteLine(0,0); }
    else if(currentIndex > i) currentIndex -= 1;
    renderQueue();
  }
  function renderQueue(){
    const list = $('notesList'); list.innerHTML = '';
    if(queue.length === 0){ list.innerHTML = '<li class="empty">아직 추가한 단어가 없습니다.</li>'; return; }
    queue.forEach((item, i) => {
      const li = document.createElement('li'); if(i === currentIndex) li.classList.add('active');
      li.innerHTML = `<span class="bullet"></span>
        <span class="word-col"><span class="w">${escapeHtml(item.title)}</span><span class="m">${escapeHtml(item.artist)}</span></span>
        <span class="remove">지우기</span>`;
      li.querySelector('.bullet').addEventListener('click', () => playIndex(i));
      li.querySelector('.word-col').addEventListener('click', () => playIndex(i));
      li.querySelector('.remove').addEventListener('click', (e) => { e.stopPropagation(); removeFromQueue(i); });
      list.appendChild(li);
    });
  }

  async function playIndex(i){
    if(i < 0 || i >= queue.length) return;
    if(!deviceId){ $('searchHint').textContent = '준비 중입니다. 잠시 후 다시 시도해주세요.'; setTimeout(() => playIndex(i), 800); return; }
    currentIndex = i; renderQueue();
    try{
      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ uris: [queue[i].uri] })
      });
    }catch(e){ $('searchHint').textContent = '요청에 실패했습니다.'; }
  }

  function goNext(){ if(queue.length) playIndex((currentIndex + 1) % queue.length); }
  function goPrev(){ if(queue.length) playIndex((currentIndex - 1 + queue.length) % queue.length); }
  $('nextBtn').addEventListener('click', goNext);
  $('prevBtn').addEventListener('click', goPrev);
  $('playPauseBtn').addEventListener('click', () => {
    if(!player || currentIndex === -1) return;
    if(localPaused) player.resume(); else player.pause();
  });

  $('addBtn').addEventListener('click', () => { const v = $('wordInput').value.trim(); if(v) search(v); });
  $('wordInput').addEventListener('keydown', (e) => { if(e.key === 'Enter'){ const v = $('wordInput').value.trim(); if(v) search(v); } });

  $('syncDot').addEventListener('click', () => { updateSyncDot(); $('modalOverlay').classList.remove('hidden'); });
  $('closeModalBtn').addEventListener('click', () => $('modalOverlay').classList.add('hidden'));
  $('syncBtn').addEventListener('click', () => { window.location.href = '/api/login'; });

  const STORE_KEY = 'gvnotes_collections';
  function loadCollections(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }catch(e){ return []; }
  }
  function saveCollections(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }

  function renderCollections(){
    const box = $('collectionsList');
    const list = loadCollections();
    if(list.length === 0){ box.innerHTML = '<div class="empty-note">저장된 모음집이 없습니다.</div>'; return; }
    box.innerHTML = '';
    list.forEach((col, i) => {
      const div = document.createElement('div'); div.className = 'collection-item';
      div.innerHTML = `<span class="del">삭제</span><span class="name">${escapeHtml(col.name)}</span><span class="count">${col.items.length}개</span>`;
      div.addEventListener('click', (e) => {
        if(e.target.classList.contains('del')){
          e.stopPropagation();
          const l = loadCollections(); l.splice(i,1); saveCollections(l); renderCollections();
          return;
        }
        queue = col.items.slice(); currentIndex = -1; renderQueue();
        if(queue.length) playIndex(0);
        $('sidePanel').classList.remove('open');
      });
      box.appendChild(div);
    });
  }

  async function fetchAccountPlaylists(){
    const box = $('accountPlaylistsList');
    if(!accessToken){ box.innerHTML = '<div class="empty-note">동기화가 필요합니다.</div>'; return; }
    box.innerHTML = '<div class="empty-note">불러오는 중...</div>';
    try{
      const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await res.json();
      if(!res.ok){
        if(res.status === 401 || res.status === 403){
          box.innerHTML = '<div class="empty-note">권한이 부족합니다. 우측 하단 점 → 동기화 시작으로 다시 로그인해주세요.</div>';
        } else {
          box.innerHTML = `<div class="empty-note">불러오지 못했습니다 (${res.status}: ${escapeHtml((data && data.error && data.error.message) || '알 수 없는 오류')})</div>`;
        }
        return;
      }
      const items = (data.items || []).filter(pl => pl); // null 항목 방어
      if(items.length === 0){ box.innerHTML = '<div class="empty-note">계정에 재생목록이 없습니다.</div>'; return; }
      box.innerHTML = '';
      items.forEach((pl) => {
        const div = document.createElement('div'); div.className = 'collection-item';
        const total = (pl.items && typeof pl.items.total === 'number') ? `${pl.items.total}곡` : '';
        div.innerHTML = `<span class="name">${escapeHtml(pl.name || '(제목없음)')}</span><span class="count">${total}</span>`;
        div.addEventListener('click', () => loadAccountPlaylist(pl.id));
        box.appendChild(div);
      });
    }catch(e){
      box.innerHTML = `<div class="empty-note">불러오지 못했습니다: ${escapeHtml(String((e && e.message) || e))}</div>`;
    }
  }

  async function loadAccountPlaylist(playlistId){
    $('searchHint').textContent = '재생목록을 불러오는 중...';
    try{
      let items = [];
      let url = `https://api.spotify.com/v1/playlists/${playlistId}/items?limit=100`;
      while(url){
        const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
        const data = await res.json();
        if(!res.ok){
          $('searchHint').textContent = `재생목록을 불러오지 못했습니다 (${res.status}: ${(data && data.error && data.error.message) || '알 수 없는 오류'})`;
          return;
        }
        (data.items || []).forEach(it => {
          const t = it && it.item;
          if(t && t.uri && t.uri.startsWith('spotify:track:')){
            items.push({ uri: t.uri, title: t.name, artist: (t.artists||[]).map(a=>a.name).join(', ') });
          }
        });
        url = data.next || null;
      }
      if(items.length === 0){
        $('searchHint').textContent = '이 재생목록에서 재생 가능한 곡을 찾지 못했습니다 (로컬 파일이거나 비어있을 수 있음).';
        return;
      }
      queue = items; currentIndex = -1; renderQueue();
      $('searchHint').textContent = '';
      playIndex(0);
      $('sidePanel').classList.remove('open');
    }catch(e){
      $('searchHint').textContent = `재생목록을 불러오지 못했습니다: ${(e && e.message) || e}`;
    }
  }

  $('collectionsToggle').addEventListener('click', () => {
    $('sidePanel').classList.toggle('open');
    renderCollections();
    fetchAccountPlaylists();
  });

  $('saveCollectionLink').addEventListener('click', () => {
    if(queue.length === 0) return;
    $('saveNameInput').value = '';
    $('saveModalOverlay').classList.remove('hidden');
  });
  $('cancelSaveBtn').addEventListener('click', () => $('saveModalOverlay').classList.add('hidden'));
  $('confirmSaveBtn').addEventListener('click', () => {
    const name = $('saveNameInput').value.trim() || `모음집 ${loadCollections().length + 1}`;
    const list = loadCollections();
    list.push({ name, items: queue.slice() });
    saveCollections(list);
    $('saveModalOverlay').classList.add('hidden');
  });

  updateSyncDot();
  renderWriteLine(0,0);
})();
</script>

</body>
</html>
