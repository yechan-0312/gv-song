<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spotify Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --panel:#121212; --panel-2:#181818; --border:#2a2a2a;
    --text:#ffffff; --text-dim:#a7a7a7; --accent:#1db954; --accent-hover:#1ed760;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background: var(--bg); color: var(--text);
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
  }
  .layout{ display:flex; height:100vh; }

  /* 사이드바 */
  .sidebar{ width: 280px; flex-shrink:0; background: var(--panel); padding: 20px 12px; display:flex; flex-direction:column; gap: 18px; overflow-y:auto; }
  .brand{ display:flex; align-items:center; gap:10px; padding: 4px 12px 8px; }
  .brand .logo{ width:28px; height:28px; border-radius:50%; background: var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:#000; }
  .brand .name{ font-weight:800; font-size:16px; letter-spacing:-0.01em; }

  .side-section{ background: var(--panel-2); border-radius: 8px; padding: 14px; }
  .side-section h3{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color: var(--text-dim); margin: 0 0 10px 6px; }
  .side-list{ display:flex; flex-direction:column; gap:1px; max-height: 240px; overflow-y:auto; }
  .side-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 8px 6px; border-radius:4px; cursor:pointer; }
  .side-item:hover{ background: rgba(255,255,255,0.06); }
  .side-item .t{ font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-item .n{ font-size:11px; color: var(--text-dim); flex-shrink:0; }
  .side-item .del{ font-size:11px; color: var(--text-dim); opacity:0; flex-shrink:0; }
  .side-item:hover .del{ opacity:1; }
  .side-empty{ font-size:12.5px; color: var(--text-dim); padding: 6px; }
  .save-current-btn{
    margin-top:10px; width:100%; background:none; border:1px solid var(--border); color: var(--text);
    border-radius: 20px; padding: 8px 0; font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .save-current-btn:hover{ border-color: var(--text); }

  .sync-status{ margin-top:auto; display:flex; align-items:center; gap:8px; padding: 10px 12px; border-top: 1px solid var(--border); cursor:pointer; }
  .sync-status .dot{ width:8px; height:8px; border-radius:50%; background:#555; flex-shrink:0; }
  .sync-status.linked .dot{ background: var(--accent); }
  .sync-status .label{ font-size:12.5px; color: var(--text-dim); }

  /* 메인 영역 */
  .main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar{ padding: 18px 32px 0; }
  .search-row{ display:flex; gap:10px; max-width:480px; }
  .search-row input{
    flex:1; background: var(--panel-2); border:1px solid var(--border); border-radius: 22px;
    padding: 11px 16px; color: var(--text); font-size:14px; outline:none;
  }
  .search-row input:focus{ border-color:#555; }
  .search-row button{
    background: var(--accent); color:#000; border:none; border-radius: 22px; padding: 0 20px;
    font-weight:700; font-size:13px; cursor:pointer;
  }
  .search-row button:hover{ background: var(--accent-hover); }
  .search-hint{ font-size:12px; color: var(--text-dim); margin-top:8px; min-height:16px; }

  .content{ flex:1; overflow-y:auto; padding: 20px 32px 0; }
  .section-title{ font-size:20px; font-weight:800; margin: 6px 0 14px; }

  .track-row{
    display:grid; grid-template-columns: 28px 1fr auto; align-items:center; gap:14px;
    padding: 9px 10px; border-radius:6px; cursor:pointer;
  }
  .track-row:hover{ background: rgba(255,255,255,0.07); }
  .track-row .idx{ color: var(--text-dim); font-size:13px; text-align:center; }
  .track-row .titles{ overflow:hidden; }
  .track-row .titles .tt{ font-size:14.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-row .titles .ar{ font-size:12.5px; color: var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-row .action{ font-size:12px; color: var(--text-dim); opacity:0; }
  .track-row:hover .action{ opacity:1; }
  .track-row.active .tt{ color: var(--accent); }
  .track-row.active .idx{ color: var(--accent); }

  .queue-empty{ color: var(--text-dim); font-size:13.5px; padding: 30px 10px; text-align:center; }

  /* 하단 플레이어 바 */
  .player-bar{
    height: 90px; background: var(--panel); border-top: 1px solid var(--border);
    display:flex; align-items:center; padding: 0 16px; gap: 24px; flex-shrink:0;
  }
  .now-playing{ width: 260px; display:flex; align-items:center; gap:12px; min-width:0; }
  .now-playing .art{ width:52px; height:52px; border-radius:4px; background: linear-gradient(135deg, #1db954, #14532d); flex-shrink:0; }
  .now-playing .meta{ min-width:0; }
  .now-playing .meta .tt{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now-playing .meta .ar{ font-size:12px; color: var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .player-center{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; max-width: 640px; margin: 0 auto; }
  .transport{ display:flex; align-items:center; gap: 20px; }
  .transport button{ background:none; border:none; color: var(--text-dim); cursor:pointer; font-size:15px; padding:0; }
  .transport button:hover{ color: var(--text); }
  .transport .play-btn{
    width:32px; height:32px; border-radius:50%; background:#fff; color:#000; display:flex;
    align-items:center; justify-content:center; font-size:13px;
  }
  .transport .play-btn:hover{ transform: scale(1.05); }

  .seek-row{ width:100%; display:flex; align-items:center; gap:10px; }
  .seek-row span{ font-size:11px; color: var(--text-dim); font-variant-numeric: tabular-nums; width:34px; }
  .seek-row span:last-child{ text-align:left; }
  .seek-row input[type=range]{
    -webkit-appearance:none; flex:1; height:4px; border-radius:2px; background: #4d4d4d; outline:none;
  }
  .seek-row input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; cursor:pointer; margin-top:-4px;
  }

  .modal-overlay{ position:fixed; inset:0; background: rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal-overlay.hidden{ display:none; }
  .modal-box{ background: var(--panel-2); border:1px solid var(--border); border-radius:10px; padding: 26px; width: 320px; }
  .modal-box p{ margin:0 0 14px; font-size:13.5px; color: var(--text-dim); }
  .modal-box .row{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
  .modal-box button{ border:1px solid var(--border); background:transparent; padding: 8px 16px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer; color: var(--text); }
  .modal-box button.primary{ background: var(--accent); color:#000; border-color: var(--accent); }
  .modal-box input[type=text]{ width:100%; background: var(--panel); border:1px solid var(--border); border-radius:6px; padding:9px 10px; font-size:13.5px; color:var(--text); outline:none; margin-top:6px; }
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="brand"><span class="logo">S</span><span class="name">Spotify Lite</span></div>

    <div class="side-section">
      <h3>내 재생목록</h3>
      <div class="side-list" id="collectionsList"><div class="side-empty">저장된 목록이 없습니다.</div></div>
      <button class="save-current-btn" id="saveCollectionLink">+ 현재 큐 저장</button>
    </div>

    <div class="side-section">
      <h3>계정 재생목록</h3>
      <div class="side-list" id="accountPlaylistsList"><div class="side-empty">동기화가 필요합니다.</div></div>
    </div>

    <div class="sync-status" id="syncStatus">
      <span class="dot"></span>
      <span class="label" id="syncLabel">연결 안 됨</span>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search-row">
        <input id="wordInput" type="text" placeholder="곡, 아티스트 검색" autocomplete="off" />
        <button id="addBtn">검색</button>
      </div>
      <div class="search-hint" id="searchHint"></div>
    </div>

    <div class="content">
      <div id="resultsSection" style="display:none;">
        <div class="section-title">검색 결과</div>
        <div id="results"></div>
      </div>

      <div class="section-title">현재 재생목록</div>
      <div id="notesList"><div class="queue-empty">큐가 비어 있습니다. 곡을 검색해서 추가해보세요.</div></div>
    </div>
  </div>
</div>

<div class="player-bar">
  <div class="now-playing">
    <div class="art"></div>
    <div class="meta">
      <div class="tt" id="npTitle">재생 중인 곡 없음</div>
      <div class="ar" id="npArtist">-</div>
    </div>
  </div>
  <div class="player-center">
    <div class="transport">
      <button id="prevBtn">⏮</button>
      <button id="playPauseBtn" class="play-btn">▶</button>
      <button id="nextBtn">⏭</button>
    </div>
    <div class="seek-row">
      <span id="curTime">0:00</span>
      <input type="range" id="progressBar" min="0" max="1000" value="0" />
      <span id="totalTime">0:00</span>
    </div>
  </div>
  <div style="width:260px;"></div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <p id="modalText">Spotify 계정과 연결되지 않았습니다.</p>
    <div class="row">
      <button id="closeModalBtn">닫기</button>
      <button id="syncBtn" class="primary">Spotify로 로그인</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="saveModalOverlay">
  <div class="modal-box">
    <p>재생목록 이름을 입력하세요.</p>
    <input type="text" id="saveNameInput" placeholder="예: 운동할 때" />
    <div class="row">
      <button id="cancelSaveBtn">취소</button>
      <button id="confirmSaveBtn" class="primary">저장</button>
    </div>
  </div>
</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
(function(){
  let accessToken = null;
  let tokenExpiresAt = 0;
  let deviceId = null;
  let player = null;
  let sdkReady = false;

  let queue = [];
  let currentIndex = -1;
  let progressTimer = null;
  let localPaused = true;
  let localPosition = 0;
  let localDuration = 0;

  const $ = (id) => document.getElementById(id);

  function fmtTime(sec){
    sec = Math.max(0, Math.floor(sec||0));
    const m = Math.floor(sec/60);
    const s = sec%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function consumeHash(){
    if(location.hash && location.hash.length > 1){
      const params = new URLSearchParams(location.hash.slice(1));
      if(params.get('at')){
        accessToken = params.get('at');
        const expIn = parseInt(params.get('exp') || '3600', 10);
        tokenExpiresAt = Date.now() + expIn * 1000;
        history.replaceState(null, '', location.pathname);
        updateSyncStatus(); initSpotifySdk(); scheduleRefresh(); fetchAccountPlaylists();
        return true;
      }
    }
    if(new URLSearchParams(location.search).get('sync_error')){
      history.replaceState(null, '', location.pathname);
    }
    return false;
  }

  async function restoreSession(){
    try{
      const res = await fetch('/api/session', { credentials: 'same-origin' });
      const data = await res.json();
      if(data && data.authenticated){
        accessToken = data.access_token;
        tokenExpiresAt = Date.now() + (data.expires_in || 3600) * 1000;
        updateSyncStatus(); initSpotifySdk(); scheduleRefresh(); fetchAccountPlaylists();
      } else {
        renderCollections();
      }
    }catch(e){ renderCollections(); }
  }

  function updateSyncStatus(){
    $('syncStatus').classList.toggle('linked', !!accessToken);
    $('syncLabel').textContent = accessToken ? '연결됨' : '연결 안 됨';
    $('modalText').textContent = accessToken ? 'Spotify 계정과 연결되어 있습니다.' : 'Spotify 계정과 연결되지 않았습니다.';
  }

  function scheduleRefresh(){
    setTimeout(doRefresh, Math.max(10000, tokenExpiresAt - Date.now() - 60000));
  }
  async function doRefresh(){
    try{
      const res = await fetch('/api/session', { credentials: 'same-origin' });
      const data = await res.json();
      if(data && data.authenticated){
        accessToken = data.access_token;
        tokenExpiresAt = Date.now() + (data.expires_in || 3600) * 1000;
        scheduleRefresh();
      } else { accessToken = null; updateSyncStatus(); }
    }catch(e){}
  }

  if(!consumeHash()){ restoreSession(); }
  renderCollections();

  window.onSpotifyWebPlaybackSDKReady = () => { sdkReady = true; if(accessToken) initSpotifySdk(); };

  function initSpotifySdk(){
    if(!sdkReady || player) return;
    player = new Spotify.Player({ name: 'Spotify Lite', getOAuthToken: cb => cb(accessToken), volume: 0.8 });
    player.addListener('ready', ({ device_id }) => { deviceId = device_id; });
    player.addListener('not_ready', () => { deviceId = null; });
    player.addListener('player_state_changed', (state) => {
      if(!state) return;
      localPaused = state.paused; localPosition = state.position; localDuration = state.duration;
      $('playPauseBtn').textContent = localPaused ? '▶' : '❚❚';
      if(!state.paused) startProgressTimer(); else stopProgressTimer();
      updateSeekUI(localPosition, localDuration);
    });
    player.addListener('authentication_error', () => { accessToken=null; updateSyncStatus(); });
    player.addListener('account_error', () => { $('searchHint').textContent = 'Spotify Premium 계정이 필요합니다.'; });
    player.connect();
  }

  function startProgressTimer(){
    stopProgressTimer();
    const startedAt = Date.now(); const basePos = localPosition;
    progressTimer = setInterval(() => {
      const cur = basePos + (Date.now() - startedAt);
      updateSeekUI(cur, localDuration);
      if(localDuration > 0 && cur >= localDuration - 300) goNext();
    }, 400);
  }
  function stopProgressTimer(){ if(progressTimer) clearInterval(progressTimer); }

  function updateSeekUI(posMs, durMs){
    $('curTime').textContent = fmtTime(posMs/1000);
    $('totalTime').textContent = fmtTime(durMs/1000);
    $('progressBar').value = durMs > 0 ? Math.floor((posMs/durMs)*1000) : 0;
  }

  let seeking = false;
  $('progressBar').addEventListener('input', () => { seeking = true; });
  $('progressBar').addEventListener('change', () => {
    if(player && localDuration > 0){
      const target = (parseInt($('progressBar').value,10)/1000) * localDuration;
      player.seek(target);
    }
    seeking = false;
  });

  async function search(query){
    const hint = $('searchHint'); $('results').innerHTML = ''; $('resultsSection').style.display = 'block';
    if(!accessToken){ hint.textContent = '검색하려면 Spotify 로그인이 필요합니다.'; $('resultsSection').style.display='none'; return; }
    hint.textContent = '검색 중...';
    try{
      const res = await fetch(`https://api.spotify.com/v1/search?type=track&limit=10&q=${encodeURIComponent(query)}`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      if(res.status === 401){ hint.textContent = '다시 로그인해주세요.'; accessToken = null; updateSyncStatus(); return; }
      const data = await res.json();
      const items = ((data.tracks && data.tracks.items) || []).map(t => ({
        uri: t.uri, title: t.name, artist: t.artists.map(a => a.name).join(', ')
      }));
      hint.textContent = items.length ? '' : '검색 결과가 없습니다.';
      renderResults(items);
    }catch(e){ hint.textContent = '네트워크 오류가 발생했습니다.'; }
  }

  function renderResults(items){
    const box = $('results'); box.innerHTML = '';
    items.forEach((item, i) => {
      const row = document.createElement('div'); row.className = 'track-row';
      row.innerHTML = `<span class="idx">${i+1}</span>
        <span class="titles"><span class="tt">${escapeHtml(item.title)}</span><span class="ar">${escapeHtml(item.artist)}</span></span>
        <span class="action">추가</span>`;
      row.addEventListener('click', () => {
        addToQueue(item); $('wordInput').value = ''; $('searchHint').textContent = ''; $('resultsSection').style.display = 'none';
      });
      box.appendChild(row);
    });
  }

  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function addToQueue(item){ queue.push(item); renderQueue(); if(currentIndex === -1) playIndex(queue.length - 1); }
  function removeFromQueue(i){
    queue.splice(i,1);
    if(currentIndex === i){
      currentIndex = -1; if(player) player.pause();
      $('playPauseBtn').textContent = '▶'; $('npTitle').textContent = '재생 중인 곡 없음'; $('npArtist').textContent = '-';
    } else if(currentIndex > i) currentIndex -= 1;
    renderQueue();
  }
  function renderQueue(){
    const list = $('notesList'); list.innerHTML = '';
    if(queue.length === 0){ list.innerHTML = '<div class="queue-empty">큐가 비어 있습니다. 곡을 검색해서 추가해보세요.</div>'; return; }
    queue.forEach((item, i) => {
      const row = document.createElement('div'); row.className = 'track-row'; if(i === currentIndex) row.classList.add('active');
      row.innerHTML = `<span class="idx">${i === currentIndex ? '♪' : i+1}</span>
        <span class="titles"><span class="tt">${escapeHtml(item.title)}</span><span class="ar">${escapeHtml(item.artist)}</span></span>
        <span class="action" data-role="remove">삭제</span>`;
      row.addEventListener('click', (e) => {
        if(e.target.dataset.role === 'remove'){ e.stopPropagation(); removeFromQueue(i); return; }
        playIndex(i);
      });
      list.appendChild(row);
    });
  }

  async function playIndex(i){
    if(i < 0 || i >= queue.length) return;
    if(!deviceId){ $('searchHint').textContent = '재생 준비 중입니다...'; setTimeout(() => playIndex(i), 800); return; }
    currentIndex = i; renderQueue();
    $('npTitle').textContent = queue[i].title;
    $('npArtist').textContent = queue[i].artist;
    try{
      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ uris: [queue[i].uri] })
      });
    }catch(e){ $('searchHint').textContent = '재생 요청에 실패했습니다.'; }
  }

  function goNext(){ if(queue.length) playIndex((currentIndex + 1) % queue.length); }
  function goPrev(){ if(queue.length) playIndex((currentIndex - 1 + queue.length) % queue.length); }
  $('nextBtn').addEventListener('click', goNext);
  $('prevBtn').addEventListener('click', goPrev);
  $('playPauseBtn').addEventListener('click', () => {
    if(!player || currentIndex === -1) return;
    if(localPaused) player.resume(); else player.pause();
  });

  $('addBtn').addEventListener('click', () => { const v = $('wordInput').value.trim(); if(v) search(v); });
  $('wordInput').addEventListener('keydown', (e) => { if(e.key === 'Enter'){ const v = $('wordInput').value.trim(); if(v) search(v); } });

  $('syncStatus').addEventListener('click', () => { updateSyncStatus(); $('modalOverlay').classList.remove('hidden'); });
  $('closeModalBtn').addEventListener('click', () => $('modalOverlay').classList.add('hidden'));
  $('syncBtn').addEventListener('click', () => { window.location.href = '/api/login'; });

  // ---------- 로컬 저장 재생목록 ----------
  const STORE_KEY = 'spotifylite_collections';
  function loadCollections(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }catch(e){ return []; }
  }
  function saveCollections(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }

  function renderCollections(){
    const box = $('collectionsList');
    const list = loadCollections();
    if(list.length === 0){ box.innerHTML = '<div class="side-empty">저장된 목록이 없습니다.</div>'; return; }
    box.innerHTML = '';
    list.forEach((col, i) => {
      const div = document.createElement('div'); div.className = 'side-item';
      div.innerHTML = `<span class="t">${escapeHtml(col.name)}</span><span class="n">${col.items.length}</span><span class="del">삭제</span>`;
      div.addEventListener('click', (e) => {
        if(e.target.classList.contains('del')){
          e.stopPropagation();
          const l = loadCollections(); l.splice(i,1); saveCollections(l); renderCollections();
          return;
        }
        queue = col.items.slice(); currentIndex = -1; renderQueue();
        if(queue.length) playIndex(0);
      });
      box.appendChild(div);
    });
  }

  $('saveCollectionLink').addEventListener('click', () => {
    if(queue.length === 0) return;
    $('saveNameInput').value = '';
    $('saveModalOverlay').classList.remove('hidden');
  });
  $('cancelSaveBtn').addEventListener('click', () => $('saveModalOverlay').classList.add('hidden'));
  $('confirmSaveBtn').addEventListener('click', () => {
    const name = $('saveNameInput').value.trim() || `재생목록 ${loadCollections().length + 1}`;
    const list = loadCollections();
    list.push({ name, items: queue.slice() });
    saveCollections(list);
    $('saveModalOverlay').classList.add('hidden');
    renderCollections();
  });

  // ---------- 계정 재생목록 (Spotify Web API, Feb 2026 /items 스키마) ----------
  async function fetchAccountPlaylists(){
    const box = $('accountPlaylistsList');
    if(!accessToken){ box.innerHTML = '<div class="side-empty">동기화가 필요합니다.</div>'; return; }
    box.innerHTML = '<div class="side-empty">불러오는 중...</div>';
    try{
      const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await res.json();
      if(!res.ok){
        if(res.status === 401 || res.status === 403){
          box.innerHTML = '<div class="side-empty">권한 부족: 다시 로그인해주세요.</div>';
        } else {
          box.innerHTML = `<div class="side-empty">불러오지 못함 (${res.status})</div>`;
        }
        return;
      }
      const items = (data.items || []).filter(pl => pl);
      if(items.length === 0){ box.innerHTML = '<div class="side-empty">재생목록이 없습니다.</div>'; return; }
      box.innerHTML = '';
      items.forEach((pl) => {
        const div = document.createElement('div'); div.className = 'side-item';
        const total = (pl.items && typeof pl.items.total === 'number') ? pl.items.total : '';
        div.innerHTML = `<span class="t">${escapeHtml(pl.name || '(제목없음)')}</span><span class="n">${total}</span>`;
        div.addEventListener('click', () => loadAccountPlaylist(pl.id));
        box.appendChild(div);
      });
    }catch(e){
      box.innerHTML = `<div class="side-empty">불러오지 못함: ${escapeHtml(String((e && e.message) || e))}</div>`;
    }
  }

  async function loadAccountPlaylist(playlistId){
    $('searchHint').textContent = '재생목록을 불러오는 중...';
    try{
      let items = [];
      let url = `https://api.spotify.com/v1/playlists/${playlistId}/items?limit=100`;
      while(url){
        const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
        const data = await res.json();
        if(!res.ok){
          $('searchHint').textContent = `재생목록을 불러오지 못했습니다 (${res.status}: ${(data && data.error && data.error.message) || '알 수 없는 오류'})`;
          return;
        }
        (data.items || []).forEach(it => {
          const t = it && it.item;
          if(t && t.uri && t.uri.startsWith('spotify:track:')){
            items.push({ uri: t.uri, title: t.name, artist: (t.artists||[]).map(a=>a.name).join(', ') });
          }
        });
        url = data.next || null;
      }
      if(items.length === 0){
        $('searchHint').textContent = '이 재생목록에서 재생 가능한 곡을 찾지 못했습니다.';
        return;
      }
      queue = items; currentIndex = -1; renderQueue();
      $('searchHint').textContent = '';
      playIndex(0);
    }catch(e){
      $('searchHint').textContent = `재생목록을 불러오지 못했습니다: ${(e && e.message) || e}`;
    }
  }

  updateSyncStatus();
})();
</script>

</body>
</html>
